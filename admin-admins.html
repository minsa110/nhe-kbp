<div class="max-w-3xl mx-auto px-4 sm:px-6 py-8">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">🔑 Admins</h1>
  <div class="card mb-6">
    <h3 class="text-sm font-semibold text-gray-700 mb-3">Add Admin by Email</h3>
    <p class="text-xs text-gray-500 mb-3">The person must have already signed up on the site first.</p>
    <div class="flex gap-2">
      <input id="new-email" type="email" class="form-input flex-1" placeholder="parent@email.com" />
      <button onclick="addAdmin()" class="btn-primary shrink-0">Add Admin</button>
    </div>
  </div>
  <div class="overflow-x-auto rounded-xl border border-gray-200 bg-white">
    <table class="data-table min-w-full">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Action</th></tr></thead>
      <tbody id="admins-tbody"><tr><td colspan="4" class="text-center py-8 text-gray-400">Loading…</td></tr></tbody>
    </table>
  </div>

</div>

<script src="js/auth.js"></script>
<script src="js/admin-common.js"></script>
<script>
renderAdminNav('admins');

initAuth({
  requireAuth: true, requireAdmin: true,
  onReady: () => load()
});

async function load() {
  const snap = await db.collection('users').where('isAdmin', '==', true).get();
  const tbody = document.getElementById('admins-tbody');
  if (snap.empty) { tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-gray-400">No admins.</td></tr>`; return; }
  tbody.innerHTML = snap.docs.map(d => {
    const u = d.data();
    const role = u.isSiteAdmin ? 'Site Admin' : 'Admin';
    const roleColor = u.isSiteAdmin ? 'bg-purple-100 text-purple-700' : 'bg-indigo-100 text-indigo-700';
    const canRemove = !u.isSiteAdmin;
    return `<tr>
      <td class="font-medium">${u.displayName || '—'}</td>
      <td class="text-sm text-gray-600">${u.email}</td>
      <td><span class="px-2 py-0.5 text-xs rounded-full font-medium ${roleColor}">${role}</span></td>
      <td>${canRemove ? `<button onclick="removeAdmin('${d.id}','${(u.displayName||u.email).replace(/'/g,'&#39;')}')" class="text-xs text-red-500 hover:underline">Remove</button>` : '—'}</td>
    </tr>`;
  }).join('');
}

async function addAdmin() {
  const email = document.getElementById('new-email').value.trim().toLowerCase();
  if (!email) { showToast('Enter an email.', 'error'); return; }
  const snap = await db.collection('users').where('email', '==', email).get();
  if (snap.empty) { showToast('No account found. They must sign up first.', 'error'); return; }
  await snap.docs[0].ref.update({ isAdmin: true });
  showToast(`${email} is now an admin.`);
  document.getElementById('new-email').value = '';
  load();
}

async function removeAdmin(uid, name) {
  if (!confirm(`Remove admin role from ${name}?`)) return;
  await db.collection('users').doc(uid).update({ isAdmin: false });
  showToast(`${name} is no longer an admin.`);
  load();
}

document.getElementById('new-email').addEventListener('keydown', e => { if (e.key === 'Enter') addAdmin(); });
</script>
