<div class="max-w-3xl mx-auto px-4 sm:px-6 py-8">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">🍎 Teachers</h1>
  <div class="card">
    <p class="text-sm text-gray-500 mb-4">Parents choose from this list when adding children. Changes take effect immediately.</p>
    <div class="flex gap-2 mb-6">
      <input id="new-teacher-input" type="text" class="form-input flex-1" placeholder="e.g. Ms. Smith" />
      <button onclick="addTeacher()" class="btn-primary">Add Teacher</button>
    </div>
    <div id="teacher-list" class="space-y-2">
      <p class="text-sm text-gray-400">Loading…</p>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/admin-common.js"></script>
<script>
renderAdminNav('teachers');

initAuth({
  requireAuth: true, requireAdmin: true,
  onReady: () => loadList()
});

async function loadList() {
  const list = await getTeacherList();
  const el = document.getElementById('teacher-list');
  if (!list.length) { el.innerHTML = `<p class="text-sm text-gray-400">No teachers yet. Add one above.</p>`; return; }
  el.innerHTML = list.map((t, i) => `
    <div id="row-${i}" class="flex items-center gap-2 bg-gray-50 rounded-lg px-4 py-3">
      <span id="label-${i}" class="text-sm font-medium text-gray-800 flex-1">${t}</span>
      <input id="input-${i}" class="form-input flex-1 hidden" value="${t.replace(/"/g, '&quot;')}" />
      <button id="edit-btn-${i}" onclick="startEdit(${i},'${t.replace(/'/g, '&#39;')}')" class="text-xs text-indigo-600 hover:underline">Edit</button>
      <button id="save-btn-${i}" onclick="saveEdit(${i},'${t.replace(/'/g, '&#39;')}')" class="text-xs text-indigo-600 hover:underline hidden">Save</button>
      <button id="cancel-btn-${i}" onclick="cancelEdit(${i},'${t.replace(/'/g, '&#39;')}')" class="text-xs text-gray-400 hover:underline hidden">Cancel</button>
      <button onclick="removeTeacher('${t.replace(/'/g, '&#39;')}')" class="text-xs text-red-500 hover:underline">Remove</button>
    </div>`).join('');
}

function startEdit(i, oldName) {
  document.getElementById(`label-${i}`).classList.add('hidden');
  document.getElementById(`input-${i}`).classList.remove('hidden');
  document.getElementById(`edit-btn-${i}`).classList.add('hidden');
  document.getElementById(`save-btn-${i}`).classList.remove('hidden');
  document.getElementById(`cancel-btn-${i}`).classList.remove('hidden');
  const input = document.getElementById(`input-${i}`);
  input.focus();
  input.select();
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') saveEdit(i, oldName);
    if (e.key === 'Escape') cancelEdit(i, oldName);
  });
}

function cancelEdit(i, oldName) {
  document.getElementById(`label-${i}`).classList.remove('hidden');
  document.getElementById(`input-${i}`).classList.add('hidden');
  document.getElementById(`edit-btn-${i}`).classList.remove('hidden');
  document.getElementById(`save-btn-${i}`).classList.add('hidden');
  document.getElementById(`cancel-btn-${i}`).classList.add('hidden');
  document.getElementById(`input-${i}`).value = oldName;
}

async function saveEdit(i, oldName) {
  const newName = document.getElementById(`input-${i}`).value.trim();
  if (!newName) { showToast('Name cannot be empty.', 'error'); return; }
  if (newName === oldName) { cancelEdit(i, oldName); return; }

  // Update teacher list
  const list = await getTeacherList();
  const updated = list.map(t => t === oldName ? newName : t);
  await db.collection('config').doc('teachers').set({ list: updated });

  // Update all children who had the old teacher name
  const childSnap = await db.collection('children').where('teacher', '==', oldName).get();
  const batch = db.batch();
  childSnap.docs.forEach(d => batch.update(d.ref, { teacher: newName }));
  if (!childSnap.empty) await batch.commit();

  showToast(`Renamed to "${newName}"${childSnap.size ? ` · updated ${childSnap.size} child record(s)` : ''}.`);
  loadList();
}

async function addTeacher() {
  const input = document.getElementById('new-teacher-input');
  const name = input.value.trim();
  if (!name) { showToast('Enter a teacher name.', 'error'); return; }
  const list = await getTeacherList();
  if (list.includes(name)) { showToast('Already in the list.', 'error'); return; }
  await db.collection('config').doc('teachers').set(
    { list: firebase.firestore.FieldValue.arrayUnion(name) }, { merge: true }
  );
  input.value = '';
  showToast(`${name} added.`);
  loadList();
}

async function removeTeacher(name) {
  if (!confirm(`Remove ${name}?`)) return;
  await db.collection('config').doc('teachers').update({
    list: firebase.firestore.FieldValue.arrayRemove(name)
  });
  showToast(`${name} removed.`);
  loadList();
}

document.getElementById('new-teacher-input').addEventListener('keydown', e => { if (e.key === 'Enter') addTeacher(); });
</script>
</body>
